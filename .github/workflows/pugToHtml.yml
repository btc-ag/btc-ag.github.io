# .github/workflows/build-pug.yml
name: Build Pug to HTML

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pug-cli
        run: npm install -g pug-cli

      - name: Clean docs folder
        run: rm -rf docs && mkdir docs

      - name: Compile Pug to HTML
        run: pug src -o docs --basedir src

      - name: Commit and push compiled HTML
        run: |
          mv docs/html/* docs/
          rm -rf docs/html
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "Build static HTML from Pug"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
