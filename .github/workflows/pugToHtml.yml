# .github/workflows/build-pug.yml
name: Build Pug to HTML

on:
  push:
    branches:
      - main
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install pug-cli and sass
        run: npm install -g pug-cli sass

      - name: Clean docs folder
        run: rm -rf docs && mkdir docs

      - name: Compile Pug to HTML
        run: pug src -o docs --basedir src

      - name: Compile SCSS to CSS
        run: |
          if [ -d "src/css" ]; then
            mkdir -p docs/css
            sass src/css:docs/css --no-source-map --style=compressed
          fi

      - name: Copy static assets and move to docs
        run: |
          for dir in fonts img js; do
            if [ -d "src/$dir" ]; then
              mkdir -p "docs/$dir"
              cp -r "src/$dir/." "docs/$dir/"
            fi
          done
          mv docs/html/* docs/
          rm -rf docs/html


      - name: Commit and push compiled HTML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "Build static HTML from Pug"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
