  Sichtbarer Einstiegspunkt in die GitHub-Präsenz der BTC Group.
anwendungsfaelle:
  - Überblick über die öffentlichen BTC-GitHub-Projekte
  - Einstiegspunkt und Weiterleitung zu den Repositories
leitplanken:
  - Ausschließlich öffentliche Inhalte
links:
  demo: https://btc-ag.github.io
