name: BTC GitHub-Landingpage
summary: >-
  Öffentliche GitHub-Landingpage der BTC Group – zentraler Einstieg zu den
  Open-Source-Projekten und Tools der BTC.
status: produktiv
kategorie: Web-App
owner: btc-ag
cluster:
  - Web-Präsenz
technik: >-
  Statische Website, aus dem src-Verzeichnis per Gulp nach docs/ gebaut und
  über GitHub Pages ausgeliefert.
techstack:
  - HTML/CSS/JS
  - Gulp
  - GitHub Pages
nutzer:
  - Externe Besucher
  - Interne Mitarbeitende
